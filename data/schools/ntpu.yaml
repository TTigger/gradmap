programs:
  - id: ntpu-csie
    name: 資訊工程學系碩士班
    kind: main
    url: https://www.csie.ntpu.edu.tw
    groups:
      - id: ntpu-csie-general
        name: 不分組
        quota: { general: 13 }
        quota_src: "p52 / 51"
        quota_note: 甄試缺額得於本項考試補足
        exam_day: "2027-02-13"
        papers:
          - { name: 資料結構與演算法, covers: [DS, ALG], weight_pct: 50, period: "第2節 12:50–14:30" }
          - { name: 線性代數與離散數學, covers: [LA, DM], weight_pct: 50, period: "第3節 15:20–17:00" }
        papers_note: 只考兩科，不考計算機組織、作業系統；簡章寫「線性代數與離散數學（各佔50%）」，總成績＝兩科原始分數各乘 1
        scoring: 總成績＝線性代數與離散數學原始分數×1＋資料結構與演算法原始分數×1
        second_stage: 無面試
        tie_break: [資料結構與演算法, 線性代數與離散數學]
        calculator: 筆試一律不得使用計算機
        notes:
          - 在三峽校區上課
          - 基礎課程「資料結構」不計入畢業學分，經系核定可免修

