id: ntu
name: 國立臺灣大學
short: 台大
year: 116
exam_type: 一般考試
status: verified
brochure:
  title: 國立臺灣大學116學年度碩士班招生簡章
  url: https://exam.aca.ntu.edu.tw/grab/Brochure/main.aspx
  published: "2026-11-10"
  verified: "2026-11-10"
  page_note: 台大簡章按系所分檔，src 寫「檔名 頁」（ntu-905＝905 系所分則，ntu-common＝簡章前頁共同規定，ntu-schedule＝重要日程表）
fee: { amount: 1500, note: 筆試及審查報名費；有口試的系所另繳口試報名費 500 元, src: "ntu-schedule p1", waiver: "低收入戶免繳、中低收入戶減免十分之三（限一系所組；11/25 起上網列印申請書，12/2 前限時掛號寄出；申請者先不要繳費）", waiver_src: "ntu-common p3" }
apply: { url: "https://exam.aca.ntu.edu.tw/grab/", how: "先索取繳款帳號繳費，再用帳號與通行碼登入填報名資料", src: "ntu-common p4" }

schedule:
  - { type: register, start: "2026-12-01T09:00", end: "2026-12-08T23:59", label: 繳費及上網登錄報名資料, note: 報名系統每天 8–9 時備份不開放；有審查的系所 12/9 17:00 前上傳資料, src: "ntu-schedule p1" }
  - { type: upload, end: "2026-12-09T17:00", label: 上傳審查資料（有審查的系所、在職生）, src: "ntu-schedule p1" }
  - { type: admit_card, start: "2027-01-13", label: 准考證開放列印（不寄發）, src: "ntu-schedule p1" }
  - { type: exam, start: "2027-01-30", end: "2027-01-31", label: 筆試, note: 資工聯招、網媒所的筆試都在第一天 1/30（六）, src: "ntu-schedule p1；ntu-periods p4" }
  - { type: result, start: "2027-03-10T12:00", label: 第1梯次放榜（資工、網媒、資安、人工智慧所）, src: "ntu-schedule p1" }
  - { type: regrade, end: "2027-03-12", label: 成績複查申請截止（第1梯次放榜者，郵戳為憑）, src: "ntu-common p9；ntu-schedule p1" }
  - { type: enroll, start: "2027-03-30T10:00", end: "2027-04-01T23:59", label: 正、備取生網路報到, note: 到「碩士班招生考試報到系統」辦理；同時正（備）取多個系所組要登記分發志願順序，送出後不能改, src: "ntu-schedule p1；ntu-common p8" }
  - { type: waitlist, start: "2027-04-09", label: 公布正取生報到及備取生遞補錄取情況（掛號寄遞補錄取通知書）, src: "ntu-common p9" }

programs:
  - id: ntu-csie
    name: 資訊工程學系碩士班與人工智慧碩士班聯合招生
    kind: main
    url: https://www.csie.ntu.edu.tw
    groups:
      - id: ntu-csie-905
        name: 聯合招生（905A 資工碩士班／905B 人工智慧碩士班）
        code: "905"
        quota: { general: 66 }
        quota_note: 正取 66、備取 75；其中資工碩士班 60（備取 60）、人工智慧碩士班 6（備取 15）。最多選兩個志願，依總分及志願序分所錄取
        quota_src: "ntu-905 p1"
        exam_day: "2027-01-30"
        papers:
          - { name: 英文(A), covers: [EN], weight_pct: 10, note: 以100分命題，成績以10%計算, period: "1/30 第三節 13:40–15:20" }
          - { name: 數學(A)（含線性代數、離散數學）, covers: [LA, DM], period: "1/30 第四節 16:00–17:40" }
          - { name: 計算機結構與作業系統, covers: [CO, OS], period: "1/30 第二節 10:30–12:10" }
          - { name: 資料結構與演算法, covers: [DS, ALG], period: "1/30 第一節 08:10–09:50" }
        papers_note: 筆試佔100%；只明列英文以10%計算，其餘三科比例簡章未明列。四科都在 1/30（六），節次見筆試科目節次分配表（p4）
        second_stage: 無（審查、口試皆 0%）
        tie_break: [數學(A), 計算機結構與作業系統, 資料結構與演算法]
  - id: ntu-inm
    name: 資訊網路與多媒體研究所碩士班
    kind: near_kin
    url: https://www.inm.ntu.edu.tw
    groups:
      - id: ntu-inm-914
        name: 不分組
        code: "914"
        quota: { general: 18 }
        quota_note: 正取 18、備取 18
        quota_src: "ntu-914 p1"
        exam_day: "2027-01-30"
        papers:
          - { name: 英文(A), covers: [EN], weight_pct: 10, note: 以100分命題，成績以10%計算, period: "1/30 第三節 13:40–15:20" }
          - { name: 計算機結構與作業系統, covers: [CO, OS], period: "1/30 第二節 10:30–12:10" }
          - { name: 資料結構與演算法, covers: [DS, ALG], period: "1/30 第一節 08:10–09:50" }
        papers_note: 不考數學；其餘兩科比例簡章未明列。三科都在 1/30（六），節次見筆試科目節次分配表（p4）
        second_stage: 無
  - id: ntu-ee-sec
    name: 電機工程學系資訊安全碩士班
    kind: near_kin
    review_only: true
    review_method: "書審 100%"
    groups:
      - id: ntu-ee-sec-904
        name: 不分組
        code: "904"
        quota: { general: 12 }
        quota_note: 正取 12、備取 30；審查成績未達 70 分不錄取
        quota_src: "ntu-904 p1"
        papers: []
        papers_note: ⚠️ 書面審查佔100%，不考筆試；考生審查資料表要先到電機系網站填寫
        second_stage: 無
  - id: ntu-giai
    name: 人工智慧研究所碩士班
    kind: near_kin
    review_only: true
    review_method: "書審 40%＋口試 60%"
    url: https://eecs.ntu.edu.tw/giai
    notes: [116 年 8 月起成立運作（919 系所分則 p1）；與資工系聯招裡的 905B「人工智慧碩士班」分開招生、各自報名]
    groups:
      - id: ntu-giai-919
        name: 不分組
        code: "919"
        quota: { general: 12 }
        quota_note: 正取 12、備取 60
        quota_src: "ntu-919 p1"
        papers: []
        papers_note: ⚠️ 不考筆試：審查 40%＋口試 60%（審查達 80 分才能口試，口試 2/15，名單 1/29 12 時公告；口試未達 80 分不錄取）
        second_stage: 口試 2/15（口試內容可含線性代數、機率與統計、資料結構與演算法、人工智慧基礎）
        tie_break: [口試成績, 審查成績]

venue: { city: 臺北／臺南, place: 報名時選臺北或臺南考區（臺南考區座位有限，中部以北建議選臺北）, src: "ntu-common p1", choose: true }
waitlist_info:
  alert: 正、備取生都要在 3/30 10:00–4/1 23:59 上網報到；沒報到的正取生取消入學資格、備取生取消遞補資格
  how: 4/9 的遞補結果公布在教務處網站「招生訊息」；之後再有缺額，依考生登記的志願順序再遞補並個別通知。新生註冊截止後改用電話、email 或簡訊通知，24 小時沒回應視同放棄。資工聯招（905）兩所的缺額，只由把該所填為第一志願的備取生依總分遞補
  where: { label: 台大碩士班招生網, url: "https://exam.aca.ntu.edu.tw/grab/" }
  deadline: 依序遞補至開學日前
  src: "ntu-common p8；ntu-common p9；ntu-905 p1"
