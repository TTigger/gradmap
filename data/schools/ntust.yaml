  - { type: other, start: "2026-12-24", label: 報名資格審查結果公告, src: "p2 / 日程表" }
  - { type: admit_card, start: "2027-01-18", label: 開放列印准考證, src: "p2 / 日程表" }
  - { type: other, start: "2027-02-15T11:00", label: 公告合於口試名單及口試時間（審查前段直接錄取者免口試）, note: 口試費 500 元要在 2/18 晚上12時前繳, src: "p2 / 日程表" }
