fee: { amount: 1300, note: 每一系所組；複試不另收費, src: "p7 / 2", waiver: "低收入戶免繳、中低收入戶報名費 520 元（限 1 系所組；12/7 12:00 前把申請表和證明 email 給招生單位，審核通過後再繳費；已繳費的不退）", waiver_src: "p7 / 2；p8 / 3；p57 / 52" }
