year: 116
exam_type: 一般考試
status: verified
brochure:
  title: 國立中山大學116學年度研究所招生考試簡章《碩士班考試入學》
  url: https://exam-acad.nsysu.edu.tw/exam_netlist/pdf_file/aca_master/TXpNME1URXhObVZzWlY5aWNtbGxabDloWTJGZmJXRnpkR1Z5TWpBeU5qRXhNRFE9.pdf
  url_note: 簡章網頁 https://exam-acad.nsysu.edu.tw/exam_netlist/netlist_main.php?ExmNo=41 （可分章節下載，另有系所筆試節次一覽表）
  verified: "2026-11-11"
