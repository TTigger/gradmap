programs:
  - id: ntnu-csie
    name: 資訊工程學系碩士班
    kind: main
    url: https://www.csie.ntnu.edu.tw
    groups:
      - id: ntnu-csie-general
        name: 不分組
        quota: { general: 50, in_service: 0 }
        quota_src: "p44 / 37"
        exam_day: "2027-01-26"
        papers:
          - { name: 軟體基礎（含資料結構、演算法）, covers: [DS, ALG], weight_pct: 34, period: "第一節 08:10–09:40" }
          - { name: 計算機系統（含計算機結構、作業系統）, covers: [CO, OS], weight_pct: 33, period: "第二節 10:10–11:40" }
          - { name: 數學基礎（含線性代數、離散數學）, covers: [LA, DM], weight_pct: 33, period: "第三節 13:10–14:40" }
        papers_note: 系所頁只列「考試節次一、二、三」；各節時間取自附件5 考試時間表（p88 / 81）
        scoring: 各科滿分100分，依「佔錄取總分百分比」計算總分
        second_stage: 無複試
        tie_break: [軟體基礎, 計算機系統, 數學基礎]
        calculator: 全部科目不得使用計算機
        notes:
          - 錄取後須於116學年度第1學期註冊入學，不得保留入學資格（服兵役除外）
          - 入學後須通過系定外語能力檢定才能畢業
          - 甄試缺額可由本項考試備取生遞補
  - id: ntnu-aica
    name: AI 跨域應用研究所
    kind: near_kin
    review_only: true
    review_method: "書審 50%＋口試 50%"
    url: https://www.ciai.ntnu.edu.tw/
    groups:
      - id: ntnu-aica-general
        name: 不分組
        quota: { general: 18 }
        quota_src: "p79 / 72"
        papers: []
        papers_note: ⚠️ 不考筆試：初試資料審查 50%（研究計畫、推薦函、自傳等），複試口試 50%（116/2/27–28）
        second_stage: 口試 50%，116/2/27–2/28（以學院網站公告為準）
        tie_break: [口試, 資料審查]
        notes:
          - 招收各領域背景（跨域），缺額可與綠能科技與永續治理研究所互相流用

rules:
  zero_score: 考試成績有一科（含）以上為零分者，不予錄取（缺考以零分計）
  zero_score_src: "p15 / 8"
  min_standard: 由招生委員會訂定各系所最低錄取標準，未達者雖有名額亦不予錄取
  tie_break_general: 總成績相同時依系所同分參酌順序，成績較高者優先

near_kin:
  - { name: 資訊教育研究所, quota: 10, note: 偏教育領域，待確認考科後決定是否列為近親所 }

venue: { city: 臺北, place: 臺北考區（本次集中筆試只設臺北考區）, src: "p1；p8" }
waitlist_info:
  how: 第一次遞補公告 116/4/9，之後如有缺額每週五公告、隔週一二報到
  where: { label: 台師大碩士班招生專區, url: "https://enroll.itc.ntnu.edu.tw/Enroll/MsEntry" }
  deadline: 遞補至 116 學年度第 1 學期上課開始日前
  src: "p2 / i"
