programs:
  - id: nccu-cs
    name: 資訊工程學系碩士班（原資訊科學系）
    kind: main
    url: https://www.cs.nccu.edu.tw/
    exclusive_groups: true
    groups:
      - id: nccu-cs-sys
        name: 資訊系統組（原資訊科學與工程組）
        code: "8611"
        quota: { general: 17 }
        quota_src: "p103"
        exam_day: "2027-02-01"
        papers: &nccu_papers
          - { name: 計算機數學（離散數學60%及線性代數40%）, covers: [DM, LA], sub_weights: { DM: 60, LA: 40 }, period: "第二節 10:30–12:10" }
          - { name: 作業系統, covers: [OS], period: "第三節 13:30–15:10" }
          - { name: 資料結構及演算法, covers: [DS, ALG], period: "第四節 15:40–17:20" }
        papers_note: 筆試佔100%，「加重計分」欄空白，推定三科等權重
        second_stage: 無
        tie_break: [資料結構及演算法, 作業系統]
      - id: nccu-cs-ai
        name: 智慧計算組
        code: "8613"
        quota: { general: 9 }
        quota_src: "p104"
        exam_day: "2027-02-01"
        papers: *nccu_papers
        papers_note: 筆試佔100%，「加重計分」欄空白，推定三科等權重
        second_stage: 無
        tie_break: [計算機數學, 資料結構及演算法]
    notes:
      - 不考計算機組織
      - 兩組屬學籍分組、名額不得流用，考生不得同時報考兩組

