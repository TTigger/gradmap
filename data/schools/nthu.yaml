programs:
  - id: nthu-cs
    name: 資訊工程學系碩士班
    kind: main
    url: http://dcs.site.nthu.edu.tw/
    groups:
      - id: nthu-cs-general
        name: 不分組
        code: "0524"
        quota: { general: 54, in_service: 3 }
        quota_src: "p35 / 27"
        exam_day: "2027-01-26"
        papers:
          - { name: 計算機科學（含資料結構、計算方法設計）, covers: [DS, ALG], weight_x: 1.0, period: "第二節 10:30–12:10" }
          - { name: 計算機系統（含作業系統、計算機結構）, covers: [OS, CO], weight_x: 1.0, period: "第三節 13:40–15:20" }
          - { name: 計算機數學（含離散數學、線性代數）, covers: [DM, LA], weight_x: 1.0, period: "第四節 16:10–17:50" }
        papers_note: 三科各滿分 100 分，初試佔總成績 100%；各節時間取自簡章考試時間（p18 / 10）與考試科目時間表（p69 / 61）
        scoring: 三科原始分數加總
        second_stage: 無複試
        tie_break: [計算機科學, 計算機系統, 計算機數學]
        calculator: 各科都不得使用計算器
        notes:
          - 錄取後不得申請轉所至資應所或資安所
          - 一般生與在職生名額分列、各自訂錄取標準；錄取不足額時可互相流用
  - id: nthu-isa
    name: 資訊系統與應用研究所碩士班
    kind: near_kin
    url: https://isa.site.nthu.edu.tw/
    groups:
      - id: nthu-isa-general
        name: 不分組
        code: "0525"
        quota: { general: 16, in_service: 1 }
        quota_src: "p35 / 27"
        exam_day: "2027-01-26"
        papers:
          - { name: 計算機概論, weight_pct: 66.7, period: "第二節 10:30–12:10" }
          - { name: 英文, covers: [EN], weight_pct: 33.3, period: "第三節 13:40–15:20" }
        papers_note: 參考書目與範圍見資應所網頁
        second_stage: 無複試
        tie_break: [計算機概論, 英文]
        calculator: 各科都不得使用計算器
        notes:
          - 錄取後不得申請轉所至資工系或資安所
  - id: nthu-iis
    name: 資訊安全研究所碩士班
    kind: near_kin
    review_only: true
    review_method: "書審 50%＋口試 50%"
    url: https://iis.site.nthu.edu.tw/
    groups:
      - id: nthu-iis-general
        name: 不分組
        code: "0526"
        quota: { general: 10 }
        quota_src: "p36 / 28"
        papers: []
        papers_note: ⚠️ 不考筆試：初試資料審查（線上上傳）50%，複試口試 50%。審查資料：大學歷年成績單、學習研究計畫書（2 頁以內）、自傳、個人資料表（系所網頁下載）、其他有利資料
        second_stage: 口試 3/11–3/18 擇一日（時間公告於資安所網頁）；複試 4/2 17:00 放榜，4/13–4/15 報到
        tie_break: [初試總分（資料審查）, 口試]
        notes:
          - 系所指定審查資料要在 12/11 23:59 前上傳，沒上傳以缺考論（p2；p18 / 10）
          - 錄取後不得申請轉所至資工系或資應所

rules:
  zero_score: 初試有一科以上缺考或零分，或複試各科都缺考者，即使總成績達錄取標準仍不予錄取
  zero_score_src: "p18 / 10"
  min_standard: 招生委員會訂定最低錄取標準，未達者雖有名額亦不錄取；最低錄取標準就是最後一位備取生的分數
  tie_break_general: 無複試系所依科目代碼順序比較；有複試系所依初試總分、口試、資料審查順序；正取最後一名仍同分則增額錄取

venue: { city: 新竹, place: 清大校本部（新竹市光復路二段101號），詳細試場 1/12 後公告, src: "p18 / 10" }
waitlist_info:
  alert: 備取生不用登記遞補意願，但備上時只用 email、簡訊或電話擇一通知（8/1 後只用手機或簡訊），要自己留意招策中心公告，逾期未報到不能以沒收到通知為由補救
  how: 正取生有缺額時由備取生依序遞補，公告在招生策略中心最新消息並個別通知
  where: { label: 清大招生策略中心, url: "https://adms.site.nthu.edu.tw/" }
  deadline: 遞補至 116 學年度第一學期開學日
  src: "p18 / 10；p19 / 11"
