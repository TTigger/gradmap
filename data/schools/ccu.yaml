schedule:
  - { type: register, start: "2026-11-26T09:00", end: "2026-12-08T17:00", label: 網路報名（填完報名表還要按「資料確認」才算完成）, note: 只繳費沒填報名資料視同未報名、不能考筆試；確認後不能改系所、考區、身分別, src: "p2 / 日程表" }
