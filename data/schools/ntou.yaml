programs:
  - id: ntou-cse
    name: 資訊工程學系碩士班
    kind: main
    review_only: true
    review_method: "資料審查 40%＋面試 60%"
    url: https://cse.ntou.edu.tw/
    groups:
      - id: ntou-cse-general
        name: 不分組（電機資訊學院碩士班聯合招生）
        quota: { general: 41, in_service: 0 }
        quota_src: "p30 / 26"
        exam_day: "2027-03-06"
        papers: []
        papers_note: ⚠️ 不考筆試：資料審查 40%＋面試 60%。審查資料：簡歷表（系網下載）、大學歷年成績單（含系排名）、自傳、專題報告或課程專案報告
        second_stage: 面試 116/3/6 09:00 起，資工系系館；面試內容含資訊工程專業科目，可能問到專題成果
        tie_break: [面試]
        notes:
          - 電資院 9 個系組聯合招生：報名時選「電機資訊學院碩士班聯合招生」，以報考系組為第 1 志願，可再選填 2 個志願（至多 3 個），報名後不能改
          - 要取得所有選填志願的成績（資料審查、面試）才有該系組錄取資格
          - 面試前一周要到資工系網頁下載面試簡報範例，並依公告時程回傳簡報電子檔（p31 / 27）
          - 電機、資工、光電與材料系是學籍分組，名額不互相流用
          - 碩士班甄試缺額由本項考試補足

rules:
  min_standard: 招生委員會訂定最低錄取標準，得不足額錄取；不足額錄取的系所組不列備取
  min_standard_src: "p18 / 14"
  tie_break_general: 最後一名同分時依系所組規定，否則按考科配分比例高者優先參酌

near_kin:
  - { name: 電機工程學系資訊科技組, quota: 13, review_method: 書審（是否面試，簡章前後寫法不同）, note: 同屬電資院聯招、不考筆試。簡章前後寫法不同：總表（p7 / 3）寫書審＋3/6 面試，系所分則（p30 / 26）寫資料審查 100%，報考前建議向海大電機系確認 }

venue: { city: 基隆, place: 資工系不考筆試；面試在海大資工系系館（基隆市中正區北寧路2號）, src: "p18 / 14；p31 / 27" }
