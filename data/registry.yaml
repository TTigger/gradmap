      - { label: 招生組, url: "https://adms-acad.ncku.edu.tw/", kind: admission }
    watch: 網頁內容由 JavaScript 載入，要用瀏覽器查。資訊聯招＝資訊工程學系＋人工智慧科技碩士學位學程。

