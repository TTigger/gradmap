# 全部收錄學校的總表：別名（給搜尋用）、各類官方資料的位置（給每日排程查核用）
# links.kind：admission 招生網站 / brochure 簡章 / stats 歷年統計 / dept 系所網站 / past_exam 考古題
# watch：排程查核時要注意的事（內部用，建置時會拿掉，不會出現在網站上）
schools:
  - id: ntu
    name: 國立臺灣大學
    short: 台大
    aliases: [臺大, 台灣大學, 臺灣大學, NTU]
    links:
      - { label: 碩士班一般考試（簡章、報名人數、錄取情況一覽表）, url: "https://www.aca.ntu.edu.tw/w/aca/LocalAdmissionClass_21072014071675661", kind: admission }
      - { label: 簡章下載, url: "https://exam.aca.ntu.edu.tw/grab/Brochure/main", kind: brochure }
      - { label: 歷年報名人數與錄取情況（同一頁下方）, url: "https://www.aca.ntu.edu.tw/w/aca/LocalAdmissionClass_21072014071675661", kind: stats }
      - { label: 資工系, url: "https://www.csie.ntu.edu.tw", kind: dept }
      - { label: 臺大考古題, url: "https://exam.lib.ntu.edu.tw/graduate", kind: past_exam }
    watch: 116 簡章約 11 月中公告（115 年度為 114/11/12）。錄取情況一覽表約 4 月公告，含最低錄取分數與備取人數。

  - id: nthu
    name: 國立清華大學
    short: 清大
    aliases: [清華, 清華大學, NTHU]
    links:
      - { label: 招生策略中心 碩士班考試, url: "https://adms.site.nthu.edu.tw/p/412-1207-3103.php?Lang=zh-tw", kind: admission }
    watch: 網頁內容由 JavaScript 載入，要用瀏覽器查。舊年度統計檔名格式為 adms.site.nthu.edu.tw/var/file/207/1207/img/342/MX_<年度>NUM.pdf（只到 99 年度），新年度位置待找。

  - id: nycu
    name: 國立陽明交通大學
    short: 陽明交大
    aliases: [交大, 陽交大, 陽明交通, 交通大學, NYCU]
    links:
      - { label: 碩士班考試入學（簡章、報名人數統計表、榜單）, url: "https://exam.nycu.edu.tw/ma-me.html", kind: admission }
      - { label: 資工系, url: "https://www.cs.nycu.edu.tw", kind: dept }
    watch: 伺服器沒有送完整憑證鏈，curl 要加 --cacert sources/certs/bundle-with-twca.pem（系統根憑證＋TWCA 中繼憑證，仍完整驗證）。檔案網址 /apfiles/action.aspx?id=… 是包裝頁，實際檔案是 /apfiles/getFile.aspx?type=1&id=…。資訊聯招統計表只公布聯招總數，不分所。

