      - { label: 資工系, url: "https://www.csie.ntnu.edu.tw", kind: dept }
    watch: 檔案連結是閱讀器頁（/xhr/announcements/file/…），實際 PDF 在 /uploads/bulletin_file/file/…。只公布報考人數，錄取人數與分數未找到。

