    aliases: [成功大學, NCKU]
    links:
      - { label: 招生組, url: "https://adms-acad.ncku.edu.tw/", kind: admission }
    watch: 招生組網頁由 JavaScript 載入。查新簡章改看資工系「研究所招生」公告 https://www.csie.ncku.edu.tw/zh-hant/news/masterAdmission（可直接讀取，會轉貼招生組公告）；另用 WebSearch「成功大學 116學年度 碩士班 招生簡章」。116 年人工智慧科技學位學程碩士班改採審查與面試（系網 news/13601），簡章公告後確認是否列為只書審近親所。資訊聯招＝資訊工程學系＋人工智慧科技碩士學位學程。

