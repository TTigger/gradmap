# 考古題索引：各校「碩士班考試」官方考古題的位置（多半是圖書館，由教務處提供，不含解答）
# years：確認過的資工所年度（學年度）；空的代表頁面要自己查、我們還沒確認
# unsure：範圍內還沒確認的年度
# access：online 線上下載 / onsite 只有館內紙本 / database 資料庫查詢 / unknown
# 只列考試入學（筆試）試題；甄試、轉學考不列
