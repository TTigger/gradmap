name: Data error 資料錯誤
description: A date, quota, subject or weight is wrong｜日期、名額、考科或比例有誤
labels: ["data: error", "needs source"]
body:
  - type: input
    id: school
    attributes:
      label: School / program 學校與系所組
      placeholder: e.g. 中央 資工 甲組
    validations: { required: true }
  - type: input
    id: field
    attributes:
      label: What is wrong 哪一項
      placeholder: e.g. exam date shows 2/3, brochure says 2/4
    validations: { required: true }
  - type: input
    id: source
    attributes:
      label: Official source (URL + page) 官方來源網址與頁碼
      description: Only official brochures / admission sites can change data｜只有官方來源能修改資料
    validations: { required: true }
